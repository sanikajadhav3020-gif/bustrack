<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BusTrack - Passenger</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

.header { background: #1e293b; padding: 16px 20px; border-bottom: 2px solid #10b981; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 1.3rem; font-weight: 800; color: #10b981; }
.pass-badge { background: #10b981; color: white; font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

.content { padding: 16px; padding-bottom: 80px; }

.card { background: #1e293b; border-radius: 16px; padding: 18px; margin-bottom: 14px; border: 1px solid #334155; }
.card-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #10b981; margin-bottom: 14px; }

.input-field { width: 100%; background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 13px 16px; color: #e2e8f0; font-size: 1rem; margin-bottom: 10px; outline: none; }
.input-field:focus { border-color: #10b981; }

.btn { width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
.btn-green { background: #10b981; color: white; }
.btn-orange { background: #f97316; color: white; }
.btn-gray { background: #334155; color: #94a3b8; }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

/* ROUTE LIST */
.route-item { background: #0f172a; border-radius: 14px; padding: 16px; margin-bottom: 10px; border: 2px solid #334155; cursor: pointer; transition: border-color 0.2s; }
.route-item:hover { border-color: #10b981; }
.route-item-header { display: flex; align-items: center; justify-content: space-between; }
.route-item-name { font-weight: 700; font-size: 1rem; }
.route-item-type { font-size: 0.7rem; background: rgba(16,185,129,0.2); color: #10b981; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
.route-item-stops { font-size: 0.8rem; color: #64748b; margin-top: 6px; }
.live-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; color: #10b981; font-weight: 700; margin-top: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pulse { animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* BUS STATUS */
.bus-status-box { background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05)); border: 2px solid rgba(16,185,129,0.3); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 14px; }
.bus-icon-big { font-size: 3rem; margin-bottom: 8px; }
.bus-current-stop { font-size: 1.3rem; font-weight: 800; color: #10b981; }
.bus-driver { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

/* ETA */
.eta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.eta-item { background: #1e293b; border-radius: 14px; padding: 14px; text-align: center; border: 1px solid #334155; }
.eta-num { font-size: 1.8rem; font-weight: 800; color: #f97316; }
.eta-label { font-size: 0.7rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-top: 2px; }

/* STOPS TIMELINE */
.stops-timeline { display: flex; flex-direction: column; gap: 0; }
.timeline-item { display: flex; gap: 12px; align-items: flex-start; }
.timeline-left { display: flex; flex-direction: column; align-items: center; }
.timeline-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #334155; background: #0f172a; flex-shrink: 0; margin-top: 3px; }
.timeline-dot.passed { background: #10b981; border-color: #10b981; }
.timeline-dot.current { background: #f97316; border-color: #f97316; box-shadow: 0 0 8px rgba(249,115,22,0.6); }
.timeline-dot.upcoming { background: #0f172a; border-color: #334155; }
.timeline-line { width: 2px; flex: 1; background: #334155; min-height: 20px; }
.timeline-line.passed { background: #10b981; }
.timeline-content { flex: 1; padding-bottom: 16px; }
.timeline-stop-name { font-size: 0.9rem; font-weight: 600; }
.timeline-stop-name.current { color: #f97316; }
.timeline-stop-name.passed { color: #64748b; }
.timeline-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
.badge-current { background: rgba(249,115,22,0.2); color: #f97316; }
.badge-passed { background: rgba(16,185,129,0.15); color: #10b981; }

/* ALERT */
.alert-box { background: rgba(249,115,22,0.15); border: 2px solid rgba(249,115,22,0.4); border-radius: 14px; padding: 14px; margin-bottom: 14px; display: none; }
.alert-title { font-weight: 800; color: #f97316; font-size: 1rem; }
.alert-msg { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

/* MY STOP */
.my-stop-selector { margin-bottom: 14px; }

/* SEARCH */
.search-box { display: flex; gap: 8px; margin-bottom: 14px; }
.search-box input { flex: 1; margin: 0; }
.search-box button { background: #10b981; color: white; border: none; border-radius: 12px; padding: 0 16px; font-weight: 700; cursor: pointer; }

.empty { text-align: center; padding: 30px; color: #475569; }
.empty-icon { font-size: 2.5rem; margin-bottom: 8px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; border: 1px solid #10b981; border-radius: 12px; padding: 12px 22px; font-weight: 600; font-size: 0.9rem; z-index: 999; transition: transform 0.4s; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }

.back-btn { background: #334155; border: none; border-radius: 10px; padding: 8px 14px; color: #94a3b8; font-weight: 600; cursor: pointer; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🚌 BusTrack</div>
  <div class="pass-badge">PASSENGER</div>
</div>

<div class="content">

  <!-- PAGE 1: Route List -->
  <div class="page active" id="page1">
    <div class="card">
      <div class="card-title">🔍 Route शोधा</div>
      <div class="search-box">
        <input class="input-field" id="searchInput" placeholder="Route नाव शोधा..." oninput="filterRoutes()" />
        <button onclick="loadRoutes()">🔄</button>
      </div>
      <div id="routesList">
        <div class="empty"><div class="empty-icon">🔍</div><p>Loading...</p></div>
      </div>
    </div>
  </div>

  <!-- PAGE 2: Bus Tracking -->
  <div class="page" id="page2">
    <button class="back-btn" onclick="goBack()">← मागे जा</button>

    <!-- Alert -->
    <div class="alert-box" id="alertBox">
      <div class="alert-title">🔔 Bus जवळ येत आहे!</div>
      <div class="alert-msg" id="alertMsg"></div>
    </div>

    <!-- Bus Status -->
    <div class="bus-status-box" id="busStatusBox">
      <div class="bus-icon-big">🚌</div>
      <div class="bus-current-stop" id="busCurrentStop">Loading...</div>
      <div class="bus-driver" id="busDriver"></div>
    </div>

    <!-- ETA -->
    <div class="eta-grid">
      <div class="eta-item">
        <div class="eta-num" id="stopsAway">--</div>
        <div class="eta-label">Stops दूर</div>
      </div>
      <div class="eta-item">
        <div class="eta-num" id="etaMins">--</div>
        <div class="eta-label">मिनिटे अंदाज</div>
      </div>
    </div>

    <!-- My Stop Selector -->
    <div class="card my-stop-selector">
      <div class="card-title">📍 माझा Stop निवडा</div>
      <select class="input-field" id="myStopSelect" onchange="updateMyStop()">
        <option value="">माझा Stop निवडा...</option>
      </select>
      <div style="font-size:0.8rem;color:#64748b;margin-top:4px">
        तुमचा stop निवडला की bus जवळ आल्यावर alert येईल!
      </div>
    </div>

    <!-- Stops Timeline -->
    <div class="card">
      <div class="card-title">🗺️ Route Progress</div>
      <div class="stops-timeline" id="stopsTimeline"></div>
    </div>

    <!-- Live Info -->
    <div class="card">
      <div class="card-title">📊 Live Info</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:#0f172a;border-radius:12px;padding:12px">
          <div style="font-size:0.65rem;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:3px">Speed</div>
          <div style="font-size:1rem;font-weight:700;color:#f97316" id="busSpeed">-- km/h</div>
        </div>
        <div style="background:#0f172a;border-radius:12px;padding:12px">
          <div style="font-size:0.65rem;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:3px">Last Update</div>
          <div style="font-size:0.85rem;font-weight:700" id="lastUpdate">--</div>
        </div>
      </div>
    </div>

    <button class="btn btn-gray" onclick="goBack()">← दुसरा Route पाहा</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
var SURL = 'https://mifvujezesxbvlvgslcn.supabase.co';
var SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pZnZ1amV6ZXN4YnZsdmdzbGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5OTA3NzEsImV4cCI6MjA5MTU2Njc3MX0.SlMxrIDW9eVPRaTn_J6JGly4jON8pFfaCLiQxrx5b7c';

var allRoutes = [];
var selectedRoute = null;
var myStop = null;
var refreshInterval = null;
var lastAlerted = null;

// ═══ PAGE 1: ROUTES ═══
function loadRoutes() {
  var list = document.getElementById('routesList');
  list.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>शोधत आहे...</p></div>';

  fetch(SURL + '/rest/v1/routes?select=*&order=route_name', {
    headers: { 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    allRoutes = data || [];
    renderRoutes(allRoutes);
  })
  .catch(function() {
    list.innerHTML = '<div class="empty"><div class="empty-icon">❌</div><p>Error - Internet तपासा</p></div>';
  });
}

function renderRoutes(routes) {
  var list = document.getElementById('routesList');
  if (!routes || routes.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🚌</div><p>कोणताही Route नाही</p></div>';
    return;
  }
  var html = '';
  routes.forEach(function(route) {
    var stopsArr = route.stops || [];
    var first = stopsArr[0] ? (stopsArr[0].name || stopsArr[0]) : '';
    var last = stopsArr[stopsArr.length-1] ? (stopsArr[stopsArr.length-1].name || stopsArr[stopsArr.length-1]) : '';
    html += '<div class="route-item" onclick="selectRoute(\'' + route.id + '\')">' +
      '<div class="route-item-header">' +
        '<div class="route-item-name">' + route.route_name + '</div>' +
        '<div class="route-item-type">' + (route.bus_type || '') + '</div>' +
      '</div>' +
      '<div class="route-item-stops">📍 ' + first + ' → ' + last + ' (' + stopsArr.length + ' stops)</div>' +
      '<div class="live-badge"><div class="dot pulse"></div> Live Tracking Available</div>' +
      '</div>';
  });
  list.innerHTML = html;
}

function filterRoutes() {
  var search = document.getElementById('searchInput').value.toLowerCase();
  var filtered = allRoutes.filter(function(r) {
    return r.route_name.toLowerCase().includes(search);
  });
  renderRoutes(filtered);
}

// ═══ PAGE 2: TRACKING ═══
function selectRoute(routeId) {
  selectedRoute = allRoutes.find(function(r) { return r.id === routeId; });
  if (!selectedRoute) return;

  // Populate my stop selector
  var select = document.getElementById('myStopSelect');
  select.innerHTML = '<option value="">माझा Stop निवडा...</option>';
  (selectedRoute.stops || []).forEach(function(stop, i) {
    var stopName = stop.name || stop;
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = (i+1) + '. ' + stopName;
    select.appendChild(opt);
  });

  document.getElementById('page1').classList.remove('active');
  document.getElementById('page2').classList.add('active');

  startTracking();
}

function goBack() {
  if (refreshInterval) clearInterval(refreshInterval);
  document.getElementById('page2').classList.remove('active');
  document.getElementById('page1').classList.add('active');
  selectedRoute = null;
  myStop = null;
}

function updateMyStop() {
  var val = document.getElementById('myStopSelect').value;
  if (val === '') { myStop = null; return; }
  var idx = parseInt(val);
  var stop = selectedRoute.stops[idx];
  myStop = { index: idx, name: stop.name || stop };
  showToast('✅ माझा Stop: ' + myStop.name);
}

function startTracking() {
  fetchBusData();
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(fetchBusData, 4000);
}

function fetchBusData() {
  if (!selectedRoute) return;
  fetch(SURL + '/rest/v1/bus_live?route_id=eq.' + selectedRoute.id + '&select=*&order=updated_at.desc&limit=1', {
    headers: { 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data && data.length > 0) {
      updateUI(data[0]);
    } else {
      document.getElementById('busCurrentStop').textContent = 'Bus अजून सुरू झाली नाही';
      document.getElementById('busDriver').textContent = '';
      document.getElementById('stopsAway').textContent = '--';
      document.getElementById('etaMins').textContent = '--';
    }
  });
}

function updateUI(bus) {
  var stops = selectedRoute.stops || [];
  var currentStopName = bus.current_stop || '';

  // Current stop display
  document.getElementById('busCurrentStop').textContent = '📍 ' + currentStopName;
  document.getElementById('busDriver').textContent = '🚘 Driver: ' + (bus.driver_name || '') + (bus.conductor_name ? ' | Conductor: ' + bus.conductor_name : '');
  document.getElementById('busSpeed').textContent = (bus.speed || 0) + ' km/h';
  document.getElementById('lastUpdate').textContent = new Date(bus.updated_at).toLocaleTimeString('mr-IN');

  // Find current stop index
  var currentIdx = -1;
  stops.forEach(function(stop, i) {
    var sName = stop.name || stop;
    if (sName === currentStopName) currentIdx = i;
  });

  // Calculate stops away & ETA
  if (myStop && currentIdx >= 0) {
    var stopsAway = myStop.index - currentIdx;
    if (stopsAway > 0) {
      document.getElementById('stopsAway').textContent = stopsAway;
      document.getElementById('etaMins').textContent = stopsAway * 5;

      // Alert when 2 stops away
      if (stopsAway <= 2 && lastAlerted !== currentStopName) {
        lastAlerted = currentStopName;
        document.getElementById('alertBox').style.display = 'block';
        document.getElementById('alertMsg').textContent = 'Bus ' + stopsAway + ' stop दूर आहे! "' + myStop.name + '" साठी तयार रहा!';
        showToast('🔔 Bus ' + stopsAway + ' stop दूर आहे!');
        // Vibrate
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
      }
    } else if (stopsAway === 0) {
      document.getElementById('stopsAway').textContent = '🎯';
      document.getElementById('etaMins').textContent = '0';
      document.getElementById('alertBox').style.display = 'block';
      document.getElementById('alertMsg').textContent = '🎯 Bus तुमच्या Stop वर आहे!';
    } else {
      document.getElementById('stopsAway').textContent = '✓';
      document.getElementById('etaMins').textContent = '--';
      document.getElementById('alertBox').style.display = 'none';
    }
  } else {
    document.getElementById('stopsAway').textContent = '--';
    document.getElementById('etaMins').textContent = '--';
  }

  // Timeline
  renderTimeline(stops, currentIdx);
}

function renderTimeline(stops, currentIdx) {
  var html = '';
  stops.forEach(function(stop, i) {
    var stopName = stop.name || stop;
    var dotClass = i < currentIdx ? 'passed' : (i === currentIdx ? 'current' : 'upcoming');
    var nameClass = i < currentIdx ? 'passed' : (i === currentIdx ? 'current' : '');
    var badge = i === currentIdx ? '<span class="timeline-badge badge-current">BUS HERE</span>' : (i < currentIdx ? '<span class="timeline-badge badge-passed">✓</span>' : '');
    var isMyStop = myStop && myStop.index === i ? ' 🏠' : '';
    var lineClass = i < currentIdx ? 'passed' : '';

    html += '<div class="timeline-item">' +
      '<div class="timeline-left">' +
        '<div class="timeline-dot ' + dotClass + '"></div>' +
        (i < stops.length - 1 ? '<div class="timeline-line ' + lineClass + '"></div>' : '') +
      '</div>' +
      '<div class="timeline-content">' +
        '<div class="timeline-stop-name ' + nameClass + '">' + stopName + isMyStop + badge + '</div>' +
      '</div>' +
      '</div>';
  });
  document.getElementById('stopsTimeline').innerHTML = html;
}

var toastTimer;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3500);
}

loadRoutes();
</script>
</body>
</html>
